name: 24/7 CEO Brain & Strategic Growth Push

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  growth-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run CEO Brain Growth Push
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node brain.js
      - name: Commit updated memory ledger & telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brain_memory.json telemetry.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(brain): update memory ledger and telemetry [skip ci]" && git push)
